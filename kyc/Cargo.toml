[package]
name = "kyc"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.22"
log = "0.4"
webbrowser = "1"
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["net", "io-util", "time"] }
url = "2"
