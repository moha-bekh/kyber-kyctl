[package]
name = "kyclient"
version = "0.1.0"
edition = "2021"

[dependencies]
thiserror = "2.0.18"
async-trait = "0.1.78"
async-tungstenite = { version = "0.33.0", features = ["tokio-rustls-platform-verifier", "tokio-runtime"], optional = true }
bytes = { version = "1.5.0", optional = true }
futures = "0.3.30"
js-sys = { version = "=0.3.77", optional = true }
libc = "0.2.153"
kyclient-common = { version = "0.1.0", path = "../kyclient-common" }
log = {version = "0.4.21", features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustls = { version = "0.23.31", optional = true, default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pemfile = { version = "2.1.3", optional = true }
rustls-platform-verifier = { version = "0.6", optional = true }
sha2 = { version = "0.10", optional = true }
serde = {version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.114", features = ["preserve_order"] }
tokio = { version = "1.47.1", features = ["macros", "sync", "io-util"] }
wasm-bindgen = { version = "0.2.84", optional = true }
wasm-bindgen-futures = { version = "0.4.37", optional = true }

kymux = { version = "0.1.0", optional = true }
kyvlcplayer = { path = "../kyvlcplayer", optional = true }
kywasmtime = { git = "https://github.com/rom1v/kywasmtime.git", tag = "0.1", optional = true }
kynput = { version = "0.1.0", optional = true }
kynput-rs = { version = "0.1.0", optional = true }
kynput-sys = { version = "0.1.0", optional = true }
kywebplayer = { path = "../kywebplayer", optional = true }
rmp-serde = { version = "1.1.2", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.21"
rustls-platform-verifier = "0.6"

[target.'cfg(target_family = "wasm")'.dependencies.web-sys]
version = "=0.3.77"
optional = true
features = [
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "MessageEvent",
    "WebSocket",
]

[build-dependencies]
vergen = { version = "8.3.1", features = ["build", "git", "gix"] }

[features]
capi = []
default = []
desktop = [
    "dep:async-tungstenite",
    "dep:kynput-rs",
    "dep:kynput-sys",
    "dep:kyvlcplayer",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:rustls-platform-verifier",
    "dep:sha2",
    "kymux?/backend-quinn",
    "kymux?/ipc",
    "kymux?/tokio-rt",
    "reqwest/cookies",
    "reqwest/rustls-no-provider",
    "tokio/rt-multi-thread",
    "tokio/fs",
    "tokio/io-util",
]
js-player = [
    "kywebplayer",
]
kymux = [
    "dep:kymux",
    "rmp-serde"
]
rtp = []
web = [
    "dep:bytes",
    "dep:js-sys",
    "dep:kywasmtime",
    "dep:kynput",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
    "kymux?/backend-webtransport-js",
    "kymux?/js",
]
websocket = ["js-player"]

[dev-dependencies]
tempfile = "3"
