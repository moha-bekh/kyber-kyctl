[package]
name = "kyclient"
version = "0.1.0"
edition = { workspace = true }

[lints]
workspace = true

[dependencies]
thiserror = "2.0.18"
async-trait = "0.1.78"
futures = "0.3.30"
libc = "0.2.153"
kyclient-common = { version = "0.1.0", path = "../kyclient-common" }
kyctl-common = { path = "../kyctl-common" }
log = { version = "0.4.21", features = ["std"] }
log4ky = { version = "0.1.0", default-features = false, features = [
    "capi",
], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmp-serde = { version = "1.1.2", optional = true }
serde = { version = "1.0.197", features = ["derive"] }
serde_json = { version = "1.0.114", features = ["preserve_order"] }
tokio = { version = "1.47.1", features = ["macros", "sync", "io-util"] }


[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
jni = "0.21"


[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-tungstenite = { version = "0.34.0", features = ["tokio-rustls-platform-verifier", "tokio-runtime"] }
kymux = { version = "0.1.0", features = ["backend-quinn", "ipc"], optional = true }
kynput-rs = "0.1.0"
kynput-sys = "0.1.0"
kyvlcplayer = { path = "../kyvlcplayer" }
reqwest = { version = "0.13", default-features = false, features = ["cookies", "rustls-no-provider"] }
rustls = { version = "0.23.31", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pemfile = "2.1.3"
rustls-platform-verifier = "0.6"
sha2 = "0.11"
tokio = { version = "1.47.1", features = ["fs", "rt-multi-thread"] }


[target.'cfg(target_family = "wasm")'.dependencies]
bytes = "1.5.0"
js-sys = "=0.3.77"
kymux = { version = "0.1.0", features = ["backend-webtransport-js", "backend-websocket-js"], optional = true }
kynput = "0.1.0"
kywasmtime = { git = "https://github.com/rom1v/kywasmtime.git", tag = "0.1" }
kywebplayer = { path = "../kywebplayer" }
wasm-bindgen = "0.2.84"
wasm-bindgen-futures = "0.4.37"
web-sys = { version = "=0.3.77", features = [
    "BinaryType",
    "CloseEvent",
    "ErrorEvent",
    "MessageEvent",
    "WebSocket",
] }

[build-dependencies]
vergen = { version = "8.3.1", features = ["build", "git", "gitcl"] }

[features]
capi = ["dep:log4ky"]
kymux = [
    "dep:kymux",
    "rmp-serde",
    "kyctl-common/kymux",
]
rtp = ["kyctl-common/rtp"]
websocket = [
    "kymux",
    "kyctl-common/websocket",
]

[dev-dependencies]
tempfile = "3"
