include_guard = "KYCLIENT_H"
no_includes = true
sys_includes = ["stdbool.h", "stdint.h"]
includes = ["kynput.h"]
tab_width = 4
style = "Type"
language = "C"
cpp_compat = true

[export]
item_types = ["enums", "structs", "unions", "typedefs", "opaque", "functions"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export.rename]
"Display" = "kyclient_Display"
"Event" = "kyclient_Event"
"LogCb" = "kyclient_LogCb"
"LogLevel" = "kyclient_LogLevel"
"VideoCodec" = "kyclient_VideoCodec"
