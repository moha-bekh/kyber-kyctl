include_guard = "KYCLIENT_H"
no_includes = true
sys_includes = ["stdbool.h", "stdint.h"]
includes = ["kynput.h"]
tab_width = 4
style = "Type"
language = "C"
cpp_compat = true

[parse]
# LogLevel and LogCb live in log4ky, not here.
parse_deps = true
include = ["log4ky"]

[export]
prefix = "kyclient_"
item_types = ["enums", "structs", "unions", "typedefs", "opaque", "functions"]
renaming_overrides_prefixing = true

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export.rename]
"kynput_Pipeline" = "kynput_Pipeline"
