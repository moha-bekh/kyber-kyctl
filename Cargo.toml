[workspace]
package.edition = "2024"
resolver = "2"

members = [
    "kycontroller",
    "kidd_client",
    "kyc",
    "kyservice",
    "kyclient",
    "kyclient-common",
    "kyclient-rs",
    "kyctl-common",
]

exclude = [
    "kymedia",
    "kynput",
    "kyutil",
    "kyvlcplayer",
    "kywebplayer",
]

[patch.crates-io]
kidd_client = { path = "kidd_client" }

[workspace.lints.clippy]
unused_async = "warn"
