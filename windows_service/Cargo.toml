[package]
name = "service"
version = "0.1.0"
edition = "2021"

[dependencies]
env_logger = "0.9.0"
log = "0.4.14"
log4rs = "1.2.0"
windows-service = "0.5.0"

[dependencies.windows-sys]
version = "0.42.0"
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
]

[build-dependencies]
vergen = { version = "8.1.1", features = ["build", "git", "gix"] }
