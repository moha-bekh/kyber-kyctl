variables:
  GIT_SUBMODULE_STRATEGY: recursive
  ANDROID_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-android:20250819181536
  DEBIAN_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-bookworm:20250819182152
  WASM_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-wasm:20250822133647
  WIN64_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-win64:20250819183159
  MACOS_RUST_VERSION: 1.89.0

stages:
  - lint
  - contrib
  - build
  - misc

.variables-macos-x86_64: &variables-macos-x86_64
  HOST_ARCH: x86_64

.variables-macos-arm64: &variables-macos-arm64
  HOST_ARCH: arm64

.variables-ios: &variables-ios
  BUILD_TARGET: ios
  RUST_VERSION: 1.89.0

.variables-tvos: &variables-tvos
  BUILD_TARGET: tvos
  RUST_VERSION: nightly-2025-08-24

.variables-visionos: &variables-visionos
  BUILD_TARGET: visionos
  RUST_VERSION: nightly-2025-08-24

.variables-android-arm64: &variables-android-arm64
  HOST_ARCH: arm64

.variables-android-armv7a: &variables-android-armv7a
  HOST_ARCH: armv7a

lint:
  stage: lint
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script:
    - cargo fmt -- --check
  cache: []

contrib-debian-bookworm-x86_64:
  stage: contrib
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Build contribs
    ./contrib/build-linux.sh -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs

contrib-windows-x86_64:
  stage: contrib
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Build contribs
    ./contrib/build-win32.sh -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs

build-debian-bookworm-x86_64:
  stage: build
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-bookworm-x86_64
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Configure imported rootfs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh
    cd -
    # Build component
    ./build-linux.sh -k -s -o $KYBER_PREFIX

clippy-debian-bookworm-x86_64:
  stage: misc
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-bookworm-x86_64
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Configure imported rootfs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh
    cd -
    # Build component
    ./build-linux.sh -k -s -o $KYBER_PREFIX
    ./build-linux.sh -k -s -c -o $KYBER_PREFIX

build-windows-x86_64:
  stage: build
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Configure imported rootfs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh
    cd -
    # Build component
    ./build-win32.sh -k -s -o $KYBER_PREFIX

clippy-windows-x86_64:
  stage: misc
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Configure imported rootfs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh
    cd -
    # Build component
    ./build-win32.sh -k -s -o $KYBER_PREFIX
    ./build-win32.sh -k -s -c -o $KYBER_PREFIX

.macos-common:
  before_script: |
    rustup override set $MACOS_RUST_VERSION

.contrib-macos-common:
  extends: .macos-common
  stage: contrib
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Build contribs
    ./contrib/build-macos.sh -a $HOST_ARCH -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs

.build-macos-common:
  extends: .macos-common
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Configure imported rootfs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh
    cd -
    # Build component
    ./build-macos.sh -k -s -a $HOST_ARCH -o $KYBER_PREFIX

contrib-macos-x86_64:
  extends: .contrib-macos-common
  variables: *variables-macos-x86_64

build-macos-x86_64:
  extends: .build-macos-common
  variables: *variables-macos-x86_64
  needs:
    - contrib-macos-x86_64

contrib-macos-arm64:
    extends: .contrib-macos-common
    variables: *variables-macos-arm64

build-macos-arm64:
  extends: .build-macos-common
  variables: *variables-macos-arm64
  needs:
    - contrib-macos-arm64

build-wasm:
  stage: build
  image: $WASM_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - lint
  script: |
    export KYBER_STAGGING_DIRECTORY=kyber-wasm-$CI_COMMIT_SHORT_SHA
    ./build-wasm.sh -k

clippy-wasm:
  stage: misc
  image: $WASM_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - build-wasm
  script: |
    ./build-wasm.sh -k -c

.build-ios-common:
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    rustup override set $RUST_VERSION
    ./build-ios.sh -k -t $BUILD_TARGET -o $(pwd)/$rootfs
  needs:
    - lint
  when: manual

build-ios:
  extends: .build-ios-common
  variables: *variables-ios

build-tvos:
  extends: .build-ios-common
  variables: *variables-tvos

build-visionos:
  extends: .build-ios-common
  variables: *variables-visionos

build-android-arm64:
  stage: build
  image: $ANDROID_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_PREFIX=$(pwd)/rootfs
    # Build
    ./build-android.sh -k -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
  artifacts:
    paths:
      - rootfs

.build-android-common:
  stage: build
  image: $ANDROID_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_PREFIX=$(pwd)/rootfs
    # Build
    ./build-android.sh -k -a $HOST_ARCH -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
  needs:
    - lint
  when: manual

build-android-arm64:
  extends: .build-android-common
  variables: *variables-android-arm64

build-android-armv7a:
  extends: .build-android-common
  variables: *variables-android-armv7a
