variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DEBIAN_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-bullseye:20220804152839
  WIN64_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-win64:20220808092349

stages:
  - lint
  - build
  - misc

lint:
  stage: lint
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script:
    - cargo fmt -- --check
  cache: []

build-debian-buster-x86_64:
  stage: build
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    ./build-linux.sh -o $(pwd)/rootfs

clippy-debian-buster-x86_64:
  stage: misc
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    ./build-linux.sh -c -o $(pwd)/rootfs

build-windows-x86_64:
  stage: build
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    ./build-win32.sh -o $(pwd)/rootfs

clippy-windows-x86_64:
  stage: misc
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    ./build-win32.sh -c -o $(pwd)/rootfs
