variables:
  GIT_SUBMODULE_STRATEGY: recursive
  DEBIAN_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-bookworm:20230721071624
  WIN64_IMAGE: registry.gitlab.com/kyber-labs/kyber-streamer/docker-images/debian-win64:20230623134530
  MACOS_RUST_VERSION: 1.70.0

stages:
  - lint
  - contrib
  - build
  - misc

.variables-macos-x86_64: &variables-macos-x86_64
  HOST_ARCH: x86_64

.variables-macos-arm64: &variables-macos-arm64
  HOST_ARCH: arm64

lint:
  stage: lint
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script:
    - cargo fmt -- --check
  cache: []

contrib-debian-bookworm-x86_64:
  stage: contrib
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Build contribs
    ./contrib/build-linux.sh -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs

contrib-windows-x86_64:
  stage: contrib
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Build contribs
    ./contrib/build-win32.sh -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs

build-debian-bookworm-x86_64:
  stage: build
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-bookworm-x86_64
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Configure imported rootfs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh
    cd -
    # Build component
    ./build-linux.sh -k -s -o $KYBER_PREFIX

clippy-debian-bookworm-x86_64:
  stage: misc
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-bookworm-x86_64
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Configure imported rootfs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh
    cd -
    # Build component
    ./build-linux.sh -k -s -o $KYBER_PREFIX
    ./build-linux.sh -k -s -c -o $KYBER_PREFIX

build-windows-x86_64:
  stage: build
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Configure imported rootfs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh
    cd -
    # Build component
    ./build-win32.sh -k -s -o $KYBER_PREFIX

clippy-windows-x86_64:
  stage: misc
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Configure imported rootfs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh
    cd -
    # Build component
    ./build-win32.sh -k -s -o $KYBER_PREFIX
    ./build-win32.sh -k -s -c -o $KYBER_PREFIX

.macos-common:
  before_script: |
    rustup override set $MACOS_RUST_VERSION

.contrib-macos-common:
  extends: .macos-common
  stage: contrib
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Build contribs
    ./contrib/build-macos.sh -a $HOST_ARCH -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs

.build-macos-common:
  extends: .macos-common
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_DIRNAME=rootfs
    export KYBER_PREFIX=$(pwd)/$KYBER_DIRNAME
    # Configure imported rootfs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh
    cd -
    # Build component
    ./build-macos.sh -k -s -a $HOST_ARCH -o $KYBER_PREFIX

contrib-macos-x86_64:
  extends: .contrib-macos-common
  variables: *variables-macos-x86_64

build-macos-x86_64:
  extends: .build-macos-common
  variables: *variables-macos-x86_64
  needs:
    - contrib-macos-x86_64

contrib-macos-arm64:
    extends: .contrib-macos-common
    variables: *variables-macos-arm64

build-macos-arm64:
  extends: .build-macos-common
  variables: *variables-macos-arm64
  needs:
    - contrib-macos-arm64
