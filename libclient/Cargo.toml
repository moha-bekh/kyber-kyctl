[package]
name = "libclient"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1.68"
async-tungstenite = { version = "0.20.0", features = ["tokio-rustls-native-certs", "tokio-runtime"] }
futures = "0.3.26"
libc = "0.2.107"
log = {version = "0.4.14", features = ["std"] }
raw-window-handle = "0.5.0"
reqwest = { version = "0.11.6", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.20.6", features = ["quic"] }
rustls-pemfile = "1.0.2"
serde = {version = "1.0.130", features = ["derive"] }
serde_json = "1.0.70"
tokio = { version = "1.21.2", features = ["rt-multi-thread", "sync"] }

kymux = "0.1.0"
libkynput-rs = "0.1.0"
libkynput-sys = "0.1.0"
vlc-rs = "0.3.0"

[features]
capi = []
default = []
