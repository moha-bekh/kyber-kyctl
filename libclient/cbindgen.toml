include_guard = "LIBCLIENT_H"
no_includes = true
sys_includes = ["stdbool.h", "stdint.h"]
includes = ["libkynput.h"]
tab_width = 4
style = "Type"
language = "C"
cpp_compat = true

[export]
item_types = ["enums", "structs", "unions", "typedefs", "opaque", "functions"]

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export.rename]
"Display" = "libclient_Display"
"Event" = "libclient_Event"
"LogCb" = "libclient_LogCb"
"LogLevel" = "libclient_LogLevel"
"StreamingProtocol" = "libclient_StreamingProtocol"
"VideoCodec" = "libclient_VideoCodec"
