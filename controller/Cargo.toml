[package]
name = "controller"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-cors = "0.7.0"
actix-files = "0.6.5"
actix-web = { version = "4.9.0", features = ["rustls-0_23"] }
actix-ws = "0.2.5"
bytes = "1.5.0"
log = "0.4.21"
log4rs = { version = "1.3.0", default-features = false, features = ["console_appender", "file_appender"] }
rustls = "0.23.13"
rustls-pemfile = "2.1.3"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
thiserror = "1.0.58"
toml = "0.8.12"
tokio = { version = "1.36.0", features = ["fs", "process", "sync", "time"] }

rcgen = "0.13.1"
sha2 = "0.10.8"
time = "0.3.34"

avservice-types = "0.1"
inputservice-types = "0.1"
kymux = {version = "0.1", features = ["backend-quinn", "backend-wtransport", "ipc", "tokio-rt"]}
libkypc = "0.1"

[features]
win32-hide-console = []

[build-dependencies]
vergen = { version = "8.3.1", features = ["build", "git", "gix"] }
