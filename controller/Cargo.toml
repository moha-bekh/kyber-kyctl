[package]
name = "controller"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-cors = "0.6.4"
actix-files = "0.6.2"
actix-web = { version = "4.4.0", features = ["rustls-0_21"] }
actix-ws = "0.2.5"
bytes = "1.2.1"
log = "0.4.14"
log4rs = "1.2.0"
rustls = { version = "0.21.8", features = ["quic"] }
rustls-pemfile = "1.0.3"
serde = { version = "1.0.130", features = ["derive"] }
serde_json = "1.0.70"
thiserror = "1.0.37"
tokio = { version = "1.33.0", features = ["fs", "process", "sync", "time"] }

rcgen = "0.11.3"
sha2 = "0.10.8"
time = "0.3.29"

avservice-types = "0.1"
inputservice-types = "0.1"
kymux = {version = "0.1", features = ["backend-quinn", "backend-wtransport", "ipc", "tokio-rt"]}
libkypc = "0.1"

[features]
win32-hide-console = []

[build-dependencies]
vergen = { version = "8.1.1", features = ["build", "git", "gix"] }
