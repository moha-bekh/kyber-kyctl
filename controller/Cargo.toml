[package]
name = "controller"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-cors = "0.7.1"
actix-files = "0.6.6"
actix-utils = "3.0.1"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = { version = "4.11.0", features = ["rustls-0_23"] }
actix-ws = "0.3.0"
base64 = { version = "0.22.1", optional = true }
bytes = "1.5.0"
log = "0.4.21"
log4rs = { version = "1.3.0", default-features = false, features = ["console_appender", "file_appender"] }
rand = "0.9.0"
rmp-serde = "1.1.2"
rustls = { version = "0.23.31", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pemfile = "2.1.3"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
thiserror = "1.0.58"
tokio = { version = "1.47.1", features = ["fs", "process", "sync", "time"] }
toml = "0.8.12"
uuid = { version = "1.18.0", features = ["v4", "fast-rng", "serde"] }

rcgen = "0.13.1"
sha2 = "0.10.8"
time = "0.3.34"

# JWT authentication specifics
jsonwebtoken = { version = "9.3.1", optional = true }

# CLI tooling specifics
clap = { version = "4.5.40", features = ["derive"], optional = true }
humantime = { version = "2.2.0", optional = true }

avservice-types = "0.1"
inputservice-types = "0.1"
kymux = {version = "0.1", features = ["backend-quinn", "backend-wtransport", "ipc", "tokio-rt"]}
libkypc = "0.1"

[features]
default = ["auth-basic"]

win32-hide-console = []

cli = ["dep:clap", "dep:humantime"]

auth-basic = ["dep:base64"]
auth-jwt = ["dep:jsonwebtoken"]

[build-dependencies]
vergen = { version = "8.3.1", features = ["build", "git", "gix"] }

[[bin]]
name = "jwt-gen"
required-features = ["auth-jwt", "cli"]
