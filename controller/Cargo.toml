[package]
name = "controller"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = { version = "4.2.1", features = ["rustls"] }
env_logger = "0.9.0"
log = "0.4.14"
rustls = "0.20.8"
rustls-pemfile = "1.0.2"
serde = { version = "1.0.130", features = ["derive"] }
serde_json = "1.0.70"
thiserror = "1.0.37"
tokio = { version = "1.21.2", features = ["fs", "process", "sync", "time"] }

avservice-types = "0.1"
inputservice-types = "0.1"
libkypc = "0.1"
