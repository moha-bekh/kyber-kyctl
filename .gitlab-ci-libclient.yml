.variables-macos-x86_64: &variables-macos-x86_64
  HOST_ARCH: x86_64

.variables-macos-arm64: &variables-macos-arm64
  HOST_ARCH: arm64

.variables-ios: &variables-ios
  BUILD_TARGET: ios
  RUST_VERSION: 1.89.0

.variables-tvos: &variables-tvos
  BUILD_TARGET: tvos
  RUST_VERSION: nightly-2025-08-24

.variables-visionos: &variables-visionos
  BUILD_TARGET: visionos
  RUST_VERSION: nightly-2025-08-24

.variables-android-arm64: &variables-android-arm64
  HOST_ARCH: arm64

.variables-android-armv7a: &variables-android-armv7a
  HOST_ARCH: armv7a

contrib-debian-trixie-x86_64:
  stage: contrib
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_PREFIX=$(pwd)/rootfs
    # Build contribs
    ./contrib/build-linux.sh -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs

contrib-windows-x86_64:
  stage: contrib
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_PREFIX=$(pwd)/rootfs
    # Build contribs
    ./contrib/build-win32.sh -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs

.contrib-macos-common:
  extends: .libclient-macos-common
  stage: contrib
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    export KYBER_PREFIX=$(pwd)/rootfs
    # Build contribs
    ./contrib/build-macos.sh -a $HOST_ARCH -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
    cd -
  artifacts:
    paths:
      - rootfs

contrib-macos-x86_64:
  extends: .contrib-macos-common
  variables: *variables-macos-x86_64

contrib-macos-arm64:
  extends: .contrib-macos-common
  variables: *variables-macos-arm64

libclient-build-debian-trixie-x86_64:
  stage: build
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-trixie-x86_64
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Build libclient
    ./build-linux.sh -k -s -o $ROOTFS_PATH

libclient-clippy-debian-trixie-x86_64:
  stage: misc
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-trixie-x86_64
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Run clippy on libclient
    ./build-linux.sh -k -s -c -o $ROOTFS_PATH

libclient-build-windows-x86_64:
  stage: build
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Build libclient
    ./build-win32.sh -k -s -o $ROOTFS_PATH

libclient-clippy-windows-x86_64:
  stage: misc
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Run clippy on libclient
    ./build-win32.sh -k -s -c -o $ROOTFS_PATH

.libclient-macos-common:
  before_script: |
    rustup override set $MACOS_RUST_VERSION

.libclient-build-macos-common:
  extends: .libclient-macos-common
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Build libclient
    ./build-macos.sh -k -s -a $HOST_ARCH -o $ROOTFS_PATH

libclient-build-macos-x86_64:
  extends: .libclient-build-macos-common
  variables: *variables-macos-x86_64
  needs:
    - contrib-macos-x86_64

libclient-build-macos-arm64:
  extends: .libclient-build-macos-common
  variables: *variables-macos-arm64
  needs:
    - contrib-macos-arm64

libclient-build-wasm:
  stage: build
  image: $WASM_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - lint
  script: |
    export KYBER_STAGGING_DIRECTORY=kyber-wasm-$CI_COMMIT_SHORT_SHA
    ./build-wasm.sh -k

libclient-clippy-wasm:
  stage: misc
  image: $WASM_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - lint
  script: |
    ./build-wasm.sh -k -c

.libclient-build-ios-common:
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  when: manual
  script: |
    rustup override set $RUST_VERSION
    ./build-ios.sh -k -t $BUILD_TARGET -o $(pwd)/rootfs
  needs:
    - lint

libclient-build-ios:
  extends: .libclient-build-ios-common
  variables: *variables-ios

libclient-build-tvos:
  extends: .libclient-build-ios-common
  variables: *variables-tvos

libclient-build-visionos:
  extends: .libclient-build-ios-common
  variables: *variables-visionos

.libclient-build-android-common:
  stage: build
  image: $ANDROID_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  when: manual
  script: |
    export KYBER_PREFIX=$(pwd)/rootfs
    # Build
    ./build-android.sh -k -a $HOST_ARCH -o $KYBER_PREFIX
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
  needs:
    - lint

libclient-build-android-arm64:
  extends: .libclient-build-android-common
  variables: *variables-android-arm64

libclient-build-android-armv7a:
  extends: .libclient-build-android-common
  variables: *variables-android-armv7a
