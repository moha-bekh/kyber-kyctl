.variables-macos-x86_64: &variables-macos-x86_64
  HOST_ARCH: x86_64

.variables-macos-arm64: &variables-macos-arm64
  HOST_ARCH: arm64

.variables-ios: &variables-ios
  BUILD_TARGET: ios
  RUST_VERSION: 1.89.0

.variables-tvos: &variables-tvos
  BUILD_TARGET: tvos
  RUST_VERSION: nightly-2025-08-24

.variables-visionos: &variables-visionos
  BUILD_TARGET: visionos
  RUST_VERSION: nightly-2025-08-24

.variables-android-arm64: &variables-android-arm64
  HOST_ARCH: arm64

.variables-android-armv7a: &variables-android-armv7a
  HOST_ARCH: armv7a

libclient-build-debian-trixie-x86_64:
  stage: build
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-trixie-x86_64
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Build libclient
    ./build-linux.sh -k -s -o $ROOTFS_PATH

libclient-clippy-debian-trixie-x86_64:
  stage: misc
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-trixie-x86_64
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Run clippy on libclient
    ./build-linux.sh -k -s -o $ROOTFS_PATH clippy-libclient

libclient-build-windows-x86_64:
  stage: build
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Build libclient
    ./build-win32.sh -k -s -o $ROOTFS_PATH

libclient-clippy-windows-x86_64:
  stage: misc
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Run clippy on libclient
    ./build-win32.sh -k -s -o $ROOTFS_PATH clippy-libclient

.libclient-macos-common:
  before_script: |
    cd $CI_BUILDS_DIR/$CI_CONCURRENT_ID/kysdk
    rm -rf kyutil kymux kynput kymedia
    rustup override set $MACOS_RUST_VERSION
    cd $CI_BUILDS_DIR/$CI_CONCURRENT_ID/kysdk/kyctl

.libclient-build-macos-common:
  extends: .libclient-macos-common
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Build libclient
    ./build-macos.sh -k -s -a $HOST_ARCH -o $ROOTFS_PATH

libclient-build-macos-x86_64:
  extends: .libclient-build-macos-common
  variables: *variables-macos-x86_64
  needs:
    - contrib-macos-x86_64

libclient-build-macos-arm64:
  extends: .libclient-build-macos-common
  variables: *variables-macos-arm64
  needs:
    - contrib-macos-arm64

libclient-build-wasm:
  stage: build
  image: $WASM_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - lint
  script: |
    export KYBER_STAGGING_DIRECTORY=kyber-wasm-$CI_COMMIT_SHORT_SHA
    ./build-wasm.sh -k build-libclient

libclient-clippy-wasm:
  stage: misc
  image: $WASM_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - lint
  script: |
    ./build-wasm.sh -k clippy-libclient

.libclient-build-ios-common:
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  when: manual
  script: |
    cd $CI_BUILDS_DIR/$CI_CONCURRENT_ID/kysdk
    rm -rf kyutil kymux kynput kymedia
    rustup override set $RUST_VERSION
    cd $CI_BUILDS_DIR/$CI_CONCURRENT_ID/kysdk/kyctl
    ./build-ios.sh -k -t $BUILD_TARGET -o $(pwd)/rootfs build-libclient
  needs:
    - lint

libclient-build-ios:
  extends: .libclient-build-ios-common
  variables: *variables-ios

libclient-build-tvos:
  extends: .libclient-build-ios-common
  variables: *variables-tvos

libclient-build-visionos:
  extends: .libclient-build-ios-common
  variables: *variables-visionos

.libclient-build-android-common:
  stage: build
  image: $ANDROID_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  when: manual
  script: |
    export KYBER_PREFIX=$(pwd)/rootfs
    # Build
    ./build-android.sh -k -a $HOST_ARCH -o $KYBER_PREFIX build-libclient
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
  needs:
    - lint

libclient-build-android-arm64:
  extends: .libclient-build-android-common
  variables: *variables-android-arm64

libclient-build-android-armv7a:
  extends: .libclient-build-android-common
  variables: *variables-android-armv7a
