[package]
name = "kyservice"
version = "0.1.0"
edition = "2021"

[dependencies]
env_logger = "0.9.0"
log = "0.4.14"
log4rs = { version = "1.3.0", default-features = false, features = ["file_appender"] }
serde = {version = "1.0.163", features = ["derive"] }
toml = "0.7.4"
windows-service = "0.5.0"

kidd_client = "0.1.0"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.52.0"
features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
vergen = { version = "8.1.1", features = ["build", "git", "gix"] }
