.variables-macos-x86_64: &variables-macos-x86_64
  HOST_ARCH: x86_64

.variables-macos-arm64: &variables-macos-arm64
  HOST_ARCH: arm64

.variables-ios: &variables-ios
  BUILD_TARGET: ios
  RUST_VERSION: 1.89.0

.variables-tvos: &variables-tvos
  BUILD_TARGET: tvos
  RUST_VERSION: nightly-2025-08-24

.variables-visionos: &variables-visionos
  BUILD_TARGET: visionos
  RUST_VERSION: nightly-2025-08-24

.variables-android-arm64: &variables-android-arm64
  HOST_ARCH: arm64

.variables-android-armv7a: &variables-android-armv7a
  HOST_ARCH: armv7a

kyclient-build-debian-trixie-x86_64:
  stage: build
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-trixie-x86_64
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Build kyclient
    ./build-linux.sh -k -s -o $ROOTFS_PATH build-kyclient

kyclient-clippy-debian-trixie-x86_64:
  stage: misc
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-trixie-x86_64
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Run clippy on kyclient
    ./build-linux.sh -k -s -o $ROOTFS_PATH clippy-kyclient

kyclient-test-debian-trixie-x86_64:
  stage: test
  image: $DEBIAN_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-debian-trixie-x86_64
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Run kyclient tests
    ./build-linux.sh -k -s -o $ROOTFS_PATH test-kyclient

kyclient-build-windows-x86_64:
  stage: build
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Build kyclient
    ./build-win32.sh -k -s -o $ROOTFS_PATH build-kyclient

kyclient-clippy-windows-x86_64:
  stage: misc
  image: $WIN64_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - contrib-windows-x86_64
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Run clippy on kyclient
    ./build-win32.sh -k -s -o $ROOTFS_PATH clippy-kyclient

.kyclient-macos-common:
  before_script: |
    rustup override set $MACOS_RUST_VERSION

.kyclient-build-macos-common:
  extends: .kyclient-macos-common
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  script: |
    # Configure contrib artifacts
    export ROOTFS_PATH=$(pwd)/rootfs
    cd $ROOTFS_PATH
    ../scripts/change_prefix.sh
    cd -
    # Build kyclient
    ./build-macos.sh -k -s -a $HOST_ARCH -o $ROOTFS_PATH build-kyclient

kyclient-build-macos-x86_64:
  extends: .kyclient-build-macos-common
  when: manual
  variables: *variables-macos-x86_64
  needs:
    - contrib-macos-x86_64

kyclient-build-macos-arm64:
  extends: .kyclient-build-macos-common
  variables: *variables-macos-arm64
  needs:
    - contrib-macos-arm64

kyclient-build-wasm:
  stage: build
  image: $WASM_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - lint
  script: |
    export KYBER_STAGGING_DIRECTORY=kyber-wasm-$CI_COMMIT_SHORT_SHA
    ./build-wasm.sh -k build-kyclient

kyclient-clippy-wasm:
  stage: misc
  image: $WASM_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  needs:
    - lint
  script: |
    ./build-wasm.sh -k clippy-kyclient

.kyclient-build-ios-common:
  stage: build
  tags:
    - macos
  only:
    - main
    - merge_requests
    - tags
  when: manual
  script: |
    rustup override set $RUST_VERSION
    ./build-ios.sh -k -t $BUILD_TARGET -o $(pwd)/rootfs build-kyclient
  needs:
    - lint

kyclient-build-ios:
  extends: .kyclient-build-ios-common
  variables: *variables-ios

kyclient-build-tvos:
  extends: .kyclient-build-ios-common
  variables: *variables-tvos

kyclient-build-visionos:
  extends: .kyclient-build-ios-common
  variables: *variables-visionos

.kyclient-build-android-common:
  stage: build
  image: $ANDROID_IMAGE
  tags:
    - docker
  only:
    - main
    - merge_requests
    - tags
  when: manual
  script: |
    export KYBER_PREFIX=$(pwd)/rootfs
    # Build
    ./build-android.sh -k -a $HOST_ARCH -o $KYBER_PREFIX build-kyclient
    # Prepare rootfs to be shared to other jobs
    cd $KYBER_PREFIX
    ../scripts/change_prefix.sh $(pwd)
  needs:
    - lint

kyclient-build-android-arm64:
  extends: .kyclient-build-android-common
  variables: *variables-android-arm64

kyclient-build-android-armv7a:
  extends: .kyclient-build-android-common
  variables: *variables-android-armv7a
