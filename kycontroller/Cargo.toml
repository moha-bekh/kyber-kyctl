[package]
name = "kycontroller"
version = "0.1.0"
edition = { workspace = true }

[lints]
workspace = true

[dependencies]
actix-cors = "0.7.1"
actix-files = "0.6.6"
actix-utils = "3.0.1"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = { version = "4.11.0", features = ["rustls-0_23"] }
actix-ws = "0.4.0"
async-trait = "0.1"
base64 = { version = "0.22.1", optional = true }
bytes = "1.5.0"
hex = { version = "0.4.3", features = ["serde"] }
futures-util = "0.3.31"
kyagent = { version = "0.1.0", optional = true }
log = "0.4.21"
log4ky = { version = "0.1.0", features = ["toml"] }
rand = "0.10.0"
rmp-serde = "1.1.2"
rustls = { version = "0.23.31", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-pemfile = "2.1.3"
serde = { version = "1.0.197", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1.0.114"
socket2 = "0.6"
thiserror = "2.0"
tokio = { version = "1.47.1", features = ["fs", "process", "sync", "time"] }
toml = "1.1"
uuid = { version = "1.18.0", features = ["v4", "fast-rng", "serde"] }

rcgen = "0.14.1"
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"], optional = true }
rsa = { version = "0.9", features = ["pem"], optional = true }
sha2 = "0.11"
time = "0.3.34"

# JWT authentication specifics
jsonwebtoken = { version = "9.3.1", optional = true }

# OIDC authentication specifics
awc = { version = "3.8.2", optional = true, default-features = false, features = ["rustls-0_23"] }
rustls-platform-verifier = { version = "0.7", optional = true }

# CLI tooling specifics
clap = { version = "4.5.40", features = ["derive"] }
humantime = { version = "2.2.0", optional = true }

kyavservice-types = "0.1"
kyctl-common = { path = "../kyctl-common", features = ["kymux", "rtp", "websocket"] }
kynputservice-types = "0.1"
kymux = { version = "0.1", features = ["backend-quinn", "backend-wtransport", "backend-actix-ws", "ipc"] }
libkypc = "0.1"

[target.'cfg(windows)'.dependencies]
# Required for service shutdown handling and tray icon (always needed on Windows)
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
] }
# System tray menu (Windows only) - we use Shell_NotifyIconW directly for the icon
muda = { version = "0.19", optional = true }
# Use png crate for consistency with libkynput
png = { version = "0.18", optional = true }

[features]
default = ["auth-basic"]

win32-hide-console = []
win32-tray = ["dep:muda", "dep:png"]

cli = ["dep:humantime", "dep:rsa", "dep:rand_core_06"]

auth-basic = ["dep:base64"]
auth-jwt = ["dep:jsonwebtoken"]
auth-oidc = ["dep:jsonwebtoken", "dep:awc", "dep:rustls-platform-verifier"]

kyhub = ["dep:kyagent"]

[build-dependencies]
vergen = { version = "8.3.1", features = ["build", "git", "gitcl"] }

[[bin]]
name = "jwt-gen"
required-features = ["auth-jwt", "cli"]
